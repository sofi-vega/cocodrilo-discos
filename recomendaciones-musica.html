<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recomendaciones musicales | El Cocodrilo Discos</title>

<!-- ====== ESTILOS (puedes mover esto a recomendaciones-musica.css) ====== -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
  --oro:#e0b43c; --oro-bright:#f5ca4e;
  --verde:#123d20; --verde-claro:#1e6b3a; --verde-oscuro:#0a2412;
  --crema:#fff4c4; --crema-dim:#f8e9b0; --fondo:#090909;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:radial-gradient(ellipse at 50% 26%, #1c2618 0%, var(--fondo) 72%);
  min-height:100vh; overflow-y:auto;
  font-family:'VT323','Courier New',monospace; color:var(--crema);
  display:flex; align-items:center; justify-content:center; padding:54px 16px 46px;
}
body::before{ content:''; position:fixed; inset:0; z-index:90; pointer-events:none;
  background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.13) 2px, rgba(0,0,0,.13) 4px); }
body::after{ content:''; position:fixed; inset:0; z-index:89; pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.5) 100%); }

.barra-titulo{ position:fixed; top:0; left:0; right:0; height:26px;
  background:linear-gradient(180deg, var(--verde-claro) 0%, var(--verde) 60%, var(--verde-oscuro) 100%);
  border-bottom:2px solid var(--oro); color:var(--crema);
  font-family:'Press Start 2P',monospace; font-size:8px; letter-spacing:1px;
  display:flex; align-items:center; padding-left:14px; z-index:100; text-shadow:1px 1px 0 var(--verde-oscuro); }
.volver{ position:fixed; top:38px; left:24px; z-index:80; padding:9px 15px;
  background:rgba(18,61,32,.92); color:var(--crema); border:2px solid var(--oro); text-decoration:none;
  font-family:'Press Start 2P',monospace; font-size:8px; letter-spacing:1px; box-shadow:3px 3px 0 rgba(0,0,0,.7); transition:transform .12s, background .12s; }
.volver:hover{ transform:translate(-2px,-2px); background:var(--verde-claro); }

.escena{ display:flex; flex-direction:column; align-items:center; gap:16px; }
.titulo{ font-family:'Press Start 2P',monospace; font-size:13px; color:var(--oro); letter-spacing:2px; text-shadow:2px 2px 0 var(--verde-oscuro); }
.subt{ font-size:19px; color:var(--crema-dim); text-align:center; }

.vitrina{ display:flex; gap:34px; align-items:stretch; }

/* ── FUNDA + VINILO ── */
.funda{ position:relative; width:300px; height:300px; flex-shrink:0; }
.vinilo{ position:absolute; top:8px; right:-52px; width:284px; height:284px; border-radius:50%; z-index:1;
  background:repeating-radial-gradient(circle at center, #0c0c0c 0 2px, #1a1a1a 2px 4px); box-shadow:inset 0 0 22px rgba(0,0,0,.9), 4px 4px 12px rgba(0,0,0,.6);
  transition:right .4s ease; }
.vinilo::after{ content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:96px; height:96px; border-radius:50%;
  background:var(--acc, #888); box-shadow:inset 0 0 8px rgba(0,0,0,.4); }
.caratula{ position:absolute; inset:0; z-index:2; padding:20px;
  background:linear-gradient(150deg, var(--acc,#444), #111);
  border:3px solid #000; box-shadow:6px 6px 0 rgba(0,0,0,.55);
  display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; }
.caratula::before{ content:''; position:absolute; inset:0; opacity:.18; pointer-events:none;
  background:repeating-linear-gradient(45deg, #fff 0 2px, transparent 2px 16px); }
.caratula .sello{ font-family:'Press Start 2P',monospace; font-size:6px; letter-spacing:1px; color:rgba(255,255,255,.8); position:relative; }
.caratula .banda{ position:relative; font-family:'Press Start 2P',monospace; font-size:22px; line-height:1.2; color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.5); }
.caratula .pais{ position:relative; font-size:22px; color:#fff; }

/* ── NOTAS ── */
.notas{ width:430px; display:flex; flex-direction:column;
  background:rgba(9,36,18,.92); border:2px solid var(--oro);
  box-shadow:6px 6px 0 rgba(0,0,0,.6), inset 0 0 30px rgba(0,0,0,.4); padding:18px 22px; }
.notas .enc{ border-bottom:1px solid rgba(224,180,60,.3); padding-bottom:10px; margin-bottom:10px; }
.notas .enc .b{ font-family:'Press Start 2P',monospace; font-size:13px; color:var(--crema); }
.notas .enc .g{ font-size:17px; color:var(--oro); margin-top:6px; }
.cuerpo{ overflow-y:auto; max-height:210px; padding-right:8px; }
.cuerpo p{ font-size:18px; line-height:1.45; color:var(--crema-dim); margin-bottom:10px; }
.cuerpo em{ font-style:italic; color:var(--crema); }
.cuerpo::-webkit-scrollbar{ width:7px; } .cuerpo::-webkit-scrollbar-thumb{ background:rgba(224,180,60,.4); } .cuerpo::-webkit-scrollbar-track{ background:rgba(0,0,0,.3); }

.tracklist{ margin-top:12px; border-top:1px solid rgba(224,180,60,.3); padding-top:10px; }
.tracklist .tl{ font-family:'Press Start 2P',monospace; font-size:7px; color:var(--oro); letter-spacing:1px; margin-bottom:8px; }
.track{ display:flex; align-items:center; gap:10px; font-size:18px; color:var(--crema-dim); padding:3px 0; }
.track .n{ font-family:'Press Start 2P',monospace; font-size:8px; color:var(--oro); min-width:18px; }
.track a{ margin-left:auto; font-family:'Press Start 2P',monospace; font-size:7px; color:var(--verde-oscuro);
  background:var(--oro); border:2px solid var(--oro-bright); padding:5px 7px; text-decoration:none; }
.track a:hover{ background:var(--oro-bright); }

.selector{ display:flex; gap:12px; }
.tab{ background:rgba(255,255,255,.04); border:2px solid #444; color:var(--crema-dim);
  font-family:'Press Start 2P',monospace; font-size:8px; letter-spacing:1px; padding:11px 16px; cursor:pointer; transition:all .14s; }
.tab:hover{ border-color:var(--oro); color:var(--crema); }
.tab.activa{ background:var(--oro); color:var(--verde-oscuro); border-color:var(--oro-bright); box-shadow:0 0 12px rgba(224,180,60,.5); }

@media(max-width:820px){ .vitrina{ flex-direction:column; align-items:center; gap:60px; } .notas{ width:360px; } .vinilo{ right:-30px; } }
</style>
</head>

<body>
  <div class="barra-titulo">▌ EL COCODRILO DISCOS  ─  RECOMENDACIONES MUSICALES</div>
  <a href="index.html?dentro=1" class="volver">← Volver</a>

  <main class="escena">
    <div class="titulo">⭐ EL COCODRILO RECOMIENDA</div>
    <div class="subt">Dos discos para tu colección. Elige una funda.</div>

    <div class="vitrina">
      <div class="funda" id="funda">
        <div class="vinilo" id="vinilo"></div>
        <div class="caratula" id="caratula">
          <div class="sello">EL COCODRILO · RECOMIENDA</div>
          <div>
            <div class="banda" id="cBanda">DIAMANTE<br>ELÉCTRICO</div>
            <div class="pais" id="cPais">🇨🇴</div>
          </div>
        </div>
      </div>

      <div class="notas">
        <div class="enc">
          <div class="b" id="nBanda">—</div>
          <div class="g" id="nGenero">—</div>
        </div>
        <div class="cuerpo" id="cuerpo"></div>
        <div class="tracklist">
          <div class="tl">▸ CANCIONES RECOMENDADAS</div>
          <div id="tracks"></div>
        </div>
      </div>
    </div>

    <div class="selector" id="selector"></div>
  </main>

<!-- ====== LÓGICA (puedes mover esto a recomendaciones-musica.js) ====== -->
<script>
const discos = [
  {
    tab:'🇨🇴 Diamante Eléctrico', banda:'DIAMANTE<br>ELÉCTRICO', nombre:'Diamante Eléctrico',
    pais:'🇨🇴', genero:'Rock colombiano · blues · garage', acc:'#c8472f',
    parrafos:[
      'Si tuviera que recomendar una banda de rock colombiana actual, recomendaría Diamante Eléctrico. Desde su formación en Bogotá han construido una propuesta que mezcla rock clásico, blues, garage rock y sonidos latinoamericanos. Sus canciones conservan la energía y la actitud del rock tradicional, pero al mismo tiempo tienen una identidad propia que los distingue dentro de la escena colombiana.',
      'Lo que más valoro de la banda es su capacidad para demostrar que el rock sigue siendo un género vigente y capaz de reinventarse. Álbumes como <em>Buitres</em> y <em>Mira lo que me hiciste hacer</em> muestran una evolución constante sin perder autenticidad.'
    ],
    canciones:['Suéltame, Bogotá','El Dorado','Personajes','Cicatrices']
  },
  {
    tab:'🌎 Muse', banda:'MUSE', nombre:'Muse',
    pais:'🇬🇧', genero:'Rock alternativo · progresivo · electrónico', acc:'#3550c8',
    parrafos:[
      'A nivel internacional recomendaría Muse, una banda británica que ha logrado combinar rock alternativo, progresivo y elementos electrónicos en una propuesta única. Sus canciones exploran temas como la identidad, el paso del tiempo, la soledad, la incertidumbre y la búsqueda de significado, siempre acompañadas por una instrumentación ambiciosa y una gran carga emocional.',
      'Lo que más valoro de Muse es su capacidad para equilibrar la energía del rock con momentos profundamente introspectivos. Muchas de sus canciones invitan a reflexionar sobre la condición humana y la fragilidad de nuestras certezas, temas que también aparecen de manera indirecta en <em>La nostalgia del melómano</em>. Por eso considero que es una banda que demuestra cómo el rock puede seguir siendo innovador, emotivo y relevante.',
      'Si tuviera que recomendar solo dos canciones para empezar a escuchar Muse, elegiría <em>Blackout</em> y <em>Thoughts of a Dying Atheist</em>. La primera transmite una sensación de fragilidad y aceptación frente al paso del tiempo, mientras que la segunda reflexiona sobre las dudas existenciales y la búsqueda de sentido. Ambas muestran una faceta más íntima de la banda y conectan muy bien con los temas de nostalgia, memoria y reflexión presentes en la novela.'
    ],
    canciones:['Blackout','Thoughts of a Dying Atheist','Hysteria','Knights of Cydonia']
  }
];

const funda=document.getElementById('funda'), vinilo=document.getElementById('vinilo'),
      caratula=document.getElementById('caratula'), cBanda=document.getElementById('cBanda'),
      cPais=document.getElementById('cPais'), nBanda=document.getElementById('nBanda'),
      nGenero=document.getElementById('nGenero'), cuerpo=document.getElementById('cuerpo'),
      tracksEl=document.getElementById('tracks'), selector=document.getElementById('selector');

let actual=-1;

discos.forEach((d,i)=>{
  const b=document.createElement('button'); b.className='tab'; b.dataset.i=i; b.innerHTML=d.tab;
  b.addEventListener('click', ()=> poner(i));
  selector.appendChild(b);
});

function poner(i){
  if(i===actual) return; actual=i; const d=discos[i];

  funda.style.setProperty('--acc', d.acc);
  cBanda.innerHTML = d.banda; cPais.textContent = d.pais;

  // sale un poco el vinilo al cambiar
  vinilo.style.right='-30px';
  setTimeout(()=>{ vinilo.style.right='-52px'; }, 260);

  nBanda.textContent = d.nombre; nGenero.textContent = d.genero;
  cuerpo.innerHTML = d.parrafos.map(p=>`<p>${p}</p>`).join('');
  cuerpo.scrollTop=0;

  tracksEl.innerHTML = d.canciones.map((c,idx)=>{
    const url='https://www.youtube.com/results?search_query='+encodeURIComponent(d.nombre+' '+c);
    return `<div class="track"><span class="n">${String(idx+1).padStart(2,'0')}</span> ${c}
      <a href="${url}" target="_blank" rel="noopener">▶</a></div>`;
  }).join('');

  document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('activa', Number(t.dataset.i)===i));
  slide();
}

let audioCtx=null;
function slide(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const dur=.22; const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*dur,audioCtx.sampleRate); const d=buf.getChannelData(0);
  for(let k=0;k<d.length;k++){ d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,2)*.4; }
  const src=audioCtx.createBufferSource(); src.buffer=buf; const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200;
  const g=audioCtx.createGain(); g.gain.value=.06; src.connect(bp); bp.connect(g); g.connect(audioCtx.destination); src.start(); }catch(_){} }

poner(0);
</script>
</body>
</html>
