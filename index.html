<!DOCTYPE html>
<html lang="es">
<head>

  <title>El Cocodrilo Discos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="pantalla">

      <a href="autor.html" class="hotspot" id="autor"

         style="left:3%; top:4%; width:20%; height:32%"></a>

         data-label="🖼️ Personajes principales"
         style="left:23%; top:13%; width:13%; height:27%"></a>

         data-label="💿 Historia del libro"
         style="left:2%; top:42%; width:23%; height:25%"></a>
      <a href="conversar.html" class="hotspot" id="miranda"
         data-label="💬 Conversar con Miranda"
         style="left:37%; top:24%; width:24%; height:35%"></a>
      <a href="contexto.html" class="hotspot" id="contexto"
         data-label="📰 Contexto político y social"
         style="left:58%; top:6%; width:15%; height:35%"></a>
      <a href="banda-sonora.html" class="hotspot" id="rockola"
         data-label="🎵 Banda sonora"
         style="left:72%; top:20%; width:13%; height:38%"></a>
      <a href="musica-literatura.html" class="hotspot" id="sofa"
         data-label="🎸 Música y literatura"

         data-label="⭐ Recomendaciones musicales"
         style="left:25%; top:70%; width:24%; height:20%"></a>

         data-label="📚 Recomendaciones literarias"
         style="left:50%; top:70%; width:22%; height:20%"></a>

  <audio id="sonidoCampana" src="audio/campana.mp3"></audio>
  <script src="script.js"></script>
